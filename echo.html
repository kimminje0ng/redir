<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>확인</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 20px; background: #fff; color: #111;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  h2 { font-size: 14px; margin: 18px 0 6px; opacity: .6; font-weight: 600; }
  pre {
    margin: 0; padding: 12px; border-radius: 10px; white-space: pre-wrap;
    word-break: break-all; background: rgba(127,127,127,.15); font-size: 13px;
  }
</style>
</head>
<body>
  <h2>받은 주소</h2>
  <pre id="href"></pre>
  <h2>쿼리 파라미터</h2>
  <pre id="params"></pre>
  <h2>UserAgent</h2>
  <pre id="ua"></pre>
<script>
(function () {
  document.getElementById('href').textContent = location.href;
  var p = new URLSearchParams(location.search), out = [];
  p.forEach(function (v, k) { out.push(k + ' = ' + v); });
  document.getElementById('params').textContent = out.length ? out.join('\n') : '(없음)';
  document.getElementById('ua').textContent = navigator.userAgent;
})();
</script>
</body>
</html>
